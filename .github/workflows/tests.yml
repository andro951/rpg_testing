name: Harness tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fetch pinned pre-template migration baseline
        run: git fetch --no-tags --depth=1 origin a64cc029837a33d4b67a6a8e4b5d686497ef943c
      - name: Verify intentional migration and preserved evidence
        run: python scripts/audit_template_migration.py
      - run: python -m unittest discover -s tests -v
      - name: Archive public source for review
        if: matrix.os == 'ubuntu-latest'
        run: git archive --format=zip HEAD -o repository-source.zip
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: public-repository-source
          path: repository-source.zip
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKBENCH_SCREENSHOT: workbench-browser.png
      WORKBENCH_MODEL_SCREENSHOT: workbench-model-browser.png
      WORKBENCH_COVERAGE_SCREENSHOT: workbench-suite-coverage.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.report_browser_smoke
      - run: python -m tests.schema_free_report_browser_smoke
      - run: python -m tests.suite_coverage_browser_smoke
      - run: python -m tests.optimization_browser_smoke
      - run: python -m tests.logs_browser_smoke
      - run: python -m tests.perchance_worker_smoke
      - run: python -m tests.perchance_workbench_smoke
      - run: python -m tests.perchance_setup_browser_smoke
        env:
          WORKBENCH_SCREENSHOT: workbench-perchance-setup.png
      - run: python -m tests.perchance_failure_browser_smoke
        env:
          WORKBENCH_SCREENSHOT: workbench-perchance-failure.png
      - name: Verify independent browser CDP connection
        run: |
          # This normal-browser launch retains the browser sandbox. Use the
          # runner's installed Chrome, rather than Playwright's bundled build.
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ] || [ ! -x "$chrome" ]; then
            echo "The CDP connection smoke requires the runner's installed Google Chrome." >&2
            exit 1
          fi
          "$chrome" --version
          REPORT_BROWSER_EXECUTABLE="$chrome" python -m tests.perchance_connection_browser_smoke
      - run: python tests/browser_smoke.py
      - run: python tests/browser_model_smoke.py
      - run: python tests/browser_targeted_smoke.py
        env:
          WORKBENCH_INDIVIDUAL_SCREENSHOT: workbench-individual-test.png
          WORKBENCH_ONE_MODEL_SCREENSHOT: workbench-one-model.png
      - run: python tests/browser_vram_assignment_smoke.py
        env:
          WORKBENCH_VRAM_BEFORE_SCREENSHOT: workbench-vram-before.png
          WORKBENCH_VRAM_AFTER_SCREENSHOT: workbench-vram-after.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-check
          path: |
            workbench-browser.png
            workbench-individual-test.png
            workbench-one-model.png
            workbench-model-browser.png
            workbench-suite-coverage.png
            workbench-perchance-setup.png
            workbench-perchance-failure.png
            workbench-vram-before.png
            workbench-vram-after.png
          if-no-files-found: ignore
          retention-days: 7

name: Harness tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Archive public source for review
        if: matrix.os == 'ubuntu-latest'
        run: git archive --format=zip HEAD -o repository-source.zip
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: public-repository-source
          path: repository-source.zip
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKBENCH_SCREENSHOT: workbench-browser.png
      WORKBENCH_MODEL_SCREENSHOT: workbench-model-browser.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/browser_model_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-check
          path: |
            workbench-browser.png
            workbench-model-browser.png
          if-no-files-found: ignore
          retention-days: 7

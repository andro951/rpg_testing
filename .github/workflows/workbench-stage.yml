name: Workbench staged checkpoint
on:
  push:
    branches: [main]
    paths: ['.workbench-stage.json']
permissions:
  contents: write
concurrency:
  group: workbench-stage
  cancel-in-progress: false
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and unpack authored checkpoint
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, zipfile
          p = pathlib.Path('.workbench-stage.json')
          payload = json.loads(p.read_text())
          data = base64.b64decode(payload['archive_base64'], validate=True)
          assert hashlib.sha256(data).hexdigest() == payload['sha256']
          allowed = ('workbench/', 'benchmarks/', 'tests/test_workbench', 'docs/')
          names = []
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for info in z.infolist():
                  name = info.filename
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert name.startswith(allowed) or name in ('Start Workbench.pyw', 'Start Demo.pyw', 'start_workbench.py', 'README.md', '.gitignore', 'requirements.txt', 'models.json', 'scripts/unity_workbench.sh')
                  assert info.file_size < 1000000 and not info.is_dir()
                  assert not ((info.external_attr >> 16) & 0o170000 == 0o120000)
                  target = pathlib.Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
                  names.append(name)
          pathlib.Path('/tmp/staged-paths.json').write_text(json.dumps(names))
          PY
      - name: Install test dependency
        run: python3 -m pip install jsonschema
      - name: Run all original and new unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Commit tested checkpoint without force-push
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/staged-paths.json').read_text())
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', '.workbench-stage.json'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: publish locally and CI-tested workbench checkpoint'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PY
